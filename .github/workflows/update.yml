# Auto-refresh Clash Verge Rev free-node subscription.
#
# Runs every 6 hours (UTC) and on manual dispatch.
# - fetches public sources listed in config/sources.yaml
# - parses / dedups / validates / scores / generates Clash Meta config
# - writes output/clash.yaml and output/status.json
# - auto-commits ONLY when the output actually changed
#
# Refuses to publish a config with fewer than the MIN_FINAL_NODES floor.

name: auto-update

on:
  schedule:
    # every 6 hours, UTC
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  # re-run on pushes so the pipeline also self-heals right after each commit
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m src.main

      - name: Run tests
        run: python -m pytest -q

      - name: Auto commit if changed
        run: |
          set -euo pipefail
          git config user.name  "clash-free-auto[bot]"
          git config user.email "418887@users.noreply.github.com"
          git add output/clash.yaml output/status.json 2>/dev/null || true
          if git diff --staged --quiet 2>/dev/null; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update clash config"
            git push
          fi
